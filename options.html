<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StickyWeb Notes</title>
    <style>
      :root { color-scheme: light dark; font: 100%/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; --brand:#b500ee; --brand-hover:#9c00ce; --text:#1c191e; --secondary:#716b75; --background:#f6f5f7; --surface:#fff; --subtle:#f2f0f3; --border:#e3e0e5; --focus:rgba(181,0,238,.18); }
      * { box-sizing:border-box; }
      html { min-width:720px; min-height:100%; background:var(--background); }
      body { min-height:100vh; margin:0; color:var(--text); background:var(--background); -webkit-font-smoothing:antialiased; }
      button,input,select { font:inherit; }
      .topbar { border-bottom:1px solid var(--border); background:var(--surface); }
      .topbar-inner { width:min(1120px,calc(100% - 48px)); height:68px; display:flex; align-items:center; margin:0 auto; }
      .brand { display:flex; align-items:center; gap:10px; }
      .logo { width:38px; height:38px; display:grid; place-items:center; border:1px solid var(--border); border-radius:10px; background:var(--surface); }
      .logo img { width:26px; height:26px; }
      .brand h1 { margin:0; font-size:15px; line-height:1.2; letter-spacing:-.015em; }
      .brand p { margin:2px 0 0; color:var(--secondary); font-size:11px; }
      .bar-actions { display:flex; gap:8px; margin-left:auto; }
      .toolbar-button { height:38px; display:inline-flex; align-items:center; gap:7px; border:1px solid var(--border); border-radius:9px; padding:0 12px; background:var(--surface); color:var(--text); cursor:pointer; font-size:12px; font-weight:650; transition:background 120ms ease,transform 80ms ease; }
      .toolbar-button:hover { background:var(--subtle); }
      .toolbar-button.primary { border-color:var(--brand); background:var(--brand); color:#fff; }
      .toolbar-button.primary:hover { border-color:var(--brand-hover); background:var(--brand-hover); }
      .toolbar-button:active { transform:scale(.98); }
      .toolbar-button svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
      .shell { width:min(1120px,calc(100% - 48px)); margin:0 auto; padding:42px 0 64px; }
      .intro { display:flex; align-items:flex-end; justify-content:space-between; gap:28px; margin-bottom:24px; }
      .intro h2 { margin:0; font-size:36px; line-height:1.1; letter-spacing:-.035em; }
      .intro-copy { max-width:580px; margin:8px 0 0; color:var(--secondary); font-size:14px; }
      .shortcut-block { flex:0 0 auto; padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:var(--surface); color:var(--secondary); font-size:11px; }
      .shortcut-block span { margin-right:7px; }
      kbd { padding:3px 6px; border:1px solid var(--border); border-radius:5px; background:var(--subtle); color:var(--text); font:650 11px/1.2 inherit; }
      .controls { display:grid; grid-template-columns:minmax(280px,1fr) minmax(220px,300px); gap:10px; padding:12px; border:1px solid var(--border); border-radius:12px; background:var(--surface); }
      .field { position:relative; }
      .field label { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
      input,select { width:100%; height:44px; border:1px solid var(--border); border-radius:9px; outline:0; background:var(--background); color:var(--text); padding:0 12px; font-size:13px; }
      input:focus,select:focus { border-color:var(--brand); box-shadow:0 0 0 3px var(--focus); }
      .summary { display:flex; justify-content:space-between; align-items:center; margin:22px 2px 10px; color:var(--secondary); font-size:11px; }
      .summary strong { color:var(--text); font-weight:650; }
      .notes { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:14px; }
      .card { --note-color:#fff3a3; min-height:176px; display:flex; flex-direction:column; overflow:hidden; border:1px solid rgba(54,42,20,.12); border-radius:12px; background:var(--note-color); box-shadow:0 3px 12px rgba(45,33,48,.06); }
      .card-main { flex:1; padding:18px 18px 14px; }
      .note-text { margin:0; color:#302a21; font-size:14px; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere; }
      .empty-text { color:rgba(48,42,33,.50); font-style:italic; }
      .card-footer { display:flex; align-items:center; gap:8px; padding:9px 12px; border-top:1px solid rgba(55,42,11,.08); background:rgba(255,255,255,.16); font-size:10px; }
      .domain { max-width:55%; overflow:hidden; color:#433a48; font-weight:700; text-overflow:ellipsis; white-space:nowrap; }
      .date { margin-left:auto; color:rgba(52,44,57,.62); white-space:nowrap; }
      .open-link { width:28px; height:28px; display:inline-grid; place-items:center; border-radius:7px; color:#64117e; text-decoration:none; transition:background 120ms ease,transform 80ms ease; }
      .open-link:hover { background:rgba(255,255,255,.45); }
      .open-link:active { transform:scale(.95); }
      .open-link svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
      .empty { grid-column:1/-1; padding:64px 24px; border:1px solid var(--border); border-radius:12px; text-align:center; color:var(--secondary); background:var(--surface); }
      .empty strong { display:block; margin-bottom:4px; color:var(--text); font-size:15px; }
      @media(max-width:780px) { html{min-width:0}.topbar-inner,.shell{width:min(100% - 24px,1120px)}.bar-actions .label{display:none}.shell{padding-top:28px}.intro{align-items:flex-start;flex-direction:column}.controls{grid-template-columns:1fr} }
      @media(prefers-color-scheme:dark) { :root{--text:#f4f1f5;--secondary:#aba4ae;--background:#19171a;--surface:#242126;--subtle:#302c32;--border:#3d3841;--brand:#cf4dff;--brand-hover:#d96cff}.card{border-color:rgba(255,255,255,.12)} }
      @media(prefers-reduced-motion:reduce) { *,*::before,*::after{transition-duration:.01ms!important} }
      @media(prefers-contrast:more) { .controls,.card,.empty,.toolbar-button{border-color:currentColor} }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="logo"><img src="icons/logo.svg" alt=""></div>
          <div><h1>StickyWeb</h1><p>Saved page notes</p></div>
        </div>
        <div class="bar-actions">
          <button class="toolbar-button" id="shortcuts" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.25 6.75 22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3-4.5 16.5"/></svg>
            <span class="label">Edit Shortcut</span>
          </button>
          <button class="toolbar-button primary" id="export" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-6L12 15m0 0 4.5-4.5M12 15V3"/></svg>
            <span>Export JSON</span>
          </button>
        </div>
      </div>
    </header>
    <main class="shell">
      <section class="intro">
        <div><h2>Notes</h2><p class="intro-copy">Search your notes, filter by website, or return to the page where a note was created.</p></div>
        <div class="shortcut-block"><span>Quick add</span><kbd id="shortcut-summary">Alt + Shift + S</kbd></div>
      </section>
      <section class="controls" aria-label="Note filters">
        <div class="field"><label for="search">Search note text</label><input id="search" type="search" placeholder="Search note text" autocomplete="off"></div>
        <div class="field"><label for="domain">Filter by domain</label><select id="domain"><option value="">All websites</option></select></div>
      </section>
      <div class="summary"><strong id="count">Loading notes…</strong><span>Stored locally in Chrome</span></div>
      <section class="notes" id="notes" aria-live="polite"></section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
